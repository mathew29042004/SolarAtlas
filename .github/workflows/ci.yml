name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync
      - run: uv run ruff check solaratlas api tests
      - run: uv run pytest -q

  spark-tests:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync
      - run: SA_SPARK_MEM=2g uv run pytest -m spark -q
        timeout-minutes: 20

  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bundle file is valid YAML with the expected job DAG
        run: |
          python3 -c "import yaml; d=yaml.safe_load(open('databricks.yml')); \
          t=[x['task_key'] for x in d['resources']['jobs']['solaratlas_pipeline']['tasks']]; \
          assert t[:3]==['bronze','silver','features'], t; print(t)"
