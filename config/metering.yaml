# Hourly simulation: how much solar a home uses itself, and what the rest is worth.
# ASSUMPTIONS, flagged in the UI. Replace the load shape with smart-meter data when available.
year: 2025                       # NASA POWER hourly year used for the simulation
load_shape_24h:                  # share of a day's consumption in each hour (local time); sums to 1
  [0.035, 0.035, 0.035, 0.035, 0.035, 0.035,      # 00-05 fans / AC at night
   0.050, 0.055, 0.050,                            # 06-08 morning peak
   0.032, 0.032, 0.032, 0.032, 0.032, 0.032, 0.032, 0.032,   # 09-16 house mostly empty
   0.040,                                          # 17
   0.065, 0.065, 0.065, 0.065,                     # 18-21 evening peak
   0.045, 0.034]                                   # 22-23
monthly_factor:                  # seasonal swing in use (AC in Mar-Jun), normalised to mean 1 in code
  [0.90, 0.95, 1.10, 1.20, 1.20, 1.05, 1.00, 1.00, 1.00, 0.95, 0.90, 0.85]
cell_temp_coeff_c_per_wm2: 0.03  # cell temperature = air + 0.03 x irradiance (W/m2)
regimes:
  self_consumption:
    label: Self-use only (export earns nothing)
  net_metering:
    label: Net metering (export offsets imports in the same bill)
    feed_in_inr: 3.00            # year-end surplus paid at this rate (ASSUMPTION; verify TNERC)
  net_billing:
    label: Net billing (imports billed, exports paid feed-in)
    feed_in_inr: 3.00            # ASSUMPTION; verify TNERC
