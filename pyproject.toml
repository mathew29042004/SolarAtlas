[project]
name = "solaratlas"
version = "0.1.0"
description = "Rooftop solar potential for every building in Tamil Nadu: a PySpark + Delta Lake lakehouse"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pyspark==3.5.7",
  "delta-spark==3.3.2",
  "duckdb>=1.1",
  "pyarrow>=17",
  "requests>=2.32",
  "pyyaml>=6",
  "shapely>=2.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "h3>=4.1",
  "pandas>=2.2",
  "numpy>=1.26",
  "setuptools>=70",   # pyspark 3.5 imports distutils, removed in Python 3.12
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["spark: needs a local Spark JVM (slower, run deliberately)"]

[tool.ruff]
line-length = 100

[tool.uv]
package = false

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
